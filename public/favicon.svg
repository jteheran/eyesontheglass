<svg width="120" height="200" viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">
  <!-- antenna - three signals radiating upward, representing full SOC visibility -->
  <line x1="60" y1="43" x2="60" y2="20" stroke="#1E3A5F" stroke-width="3" stroke-linecap="round"/>
  <line x1="60" y1="22" x2="46" y2="12" stroke="#1E3A5F" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="22" x2="74" y2="12" stroke="#1E3A5F" stroke-width="2" stroke-linecap="round"/>
  <line x1="60" y1="22" x2="60" y2="10" stroke="#1E3A5F" stroke-width="2" stroke-linecap="round"/>
  <circle cx="46" cy="10" r="4" fill="#1E3A5F"/>
  <circle cx="74" cy="10" r="4" fill="#1E3A5F"/>
  <circle cx="60" cy="8" r="4" fill="#1E3A5F"/>
  <!-- body -->
  <ellipse cx="60" cy="115" rx="42" ry="36" fill="#1E3A5F"/>
  <!-- head dome -->
  <ellipse cx="60" cy="90" rx="34" ry="30" fill="#1E3A5F"/>
  <!-- face plate -->
  <ellipse cx="60" cy="93" rx="22" ry="20" fill="white" opacity="0.95"/>
  <!-- eyes - both wide and alert, commanding presence -->
  <ellipse cx="52" cy="91" rx="7" ry="7" fill="#1a1a1a"/>
  <ellipse cx="68" cy="91" rx="7" ry="7" fill="#1a1a1a"/>
  <!-- eye shine -->
  <circle cx="54" cy="88" r="2" fill="white"/>
  <circle cx="70" cy="88" r="2" fill="white"/>
  <!-- subtle brow — authoritative but calm -->
  <line x1="47" y1="83" x2="57" y2="84" stroke="#1E3A5F" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="73" y1="83" x2="63" y2="84" stroke="#1E3A5F" stroke-width="1.5" stroke-linecap="round"/>
  <!-- legs -->
  <rect x="34" y="143" width="10" height="18" rx="5" fill="#1E3A5F"/>
  <rect x="48" y="145" width="10" height="16" rx="5" fill="#1E3A5F"/>
  <rect x="62" y="145" width="10" height="16" rx="5" fill="#1E3A5F"/>
  <rect x="76" y="143" width="10" height="18" rx="5" fill="#1E3A5F"/>
  <!-- shadow -->
  <ellipse cx="60" cy="167" rx="36" ry="5" fill="#1E3A5F" opacity="0.15"/>
</svg>
