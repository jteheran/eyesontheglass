<svg id="tora" width="120" height="200" viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- NEW TORA FIRE GRADIENT -->
    <linearGradient id="bodyGrad"
                    x1="0%"
                    y1="0%"
                    x2="100%"
                    y2="100%">

      <stop offset="0%" stop-color="#FFB347"/>
      <stop offset="38%" stop-color="#F97316"/>
      <stop offset="72%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>

    </linearGradient>

    <!-- Warm face -->
    <radialGradient id="faceWarm"
                    cx="40%"
                    cy="30%"
                    r="70%">

      <stop offset="0%" stop-color="#FFF4E6"/>
      <stop offset="100%" stop-color="#F5D0A9"/>

    </radialGradient>

    <!-- Eye depth -->
    <radialGradient id="pupilGrad"
                    cx="40%"
                    cy="35%"
                    r="60%">

      <stop offset="0%" stop-color="#2A2A2A"/>
      <stop offset="100%" stop-color="#000000"/>

    </radialGradient>

    <!-- Soft blur -->
    <filter id="softBlur">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>

    <!-- Ground shadow -->
    <filter id="shadowBlur">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>

  </defs>

  <!-- Ground shadow -->
  <ellipse cx="60"
           cy="170"
           rx="35"
           ry="6"
           fill="#000"
           opacity="0.14"
           filter="url(#shadowBlur)"/>

  <!-- CHARACTER -->
  <g id="character">

    <!-- Energetic bounce -->
    <animateTransform attributeName="transform"
      type="translate"
      values="0,0; 0,-5; 0,0"
      dur="2.5s"
      repeatCount="indefinite"/>

    <!-- Alert tilt -->
    <animateTransform attributeName="transform"
      type="rotate"
      values="0 60 100; 1.5 60 100; 0 60 100; -1.2 60 100; 0 60 100"
      dur="2.5s"
      repeatCount="indefinite"
      additive="sum"/>

    <!-- Antenna -->
    <path d="M60,43 Q45,25 50,13"
          stroke="#F97316"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"/>

    <circle cx="49"
            cy="10"
            r="5"
            fill="url(#bodyGrad)"/>

    <!-- Body -->
    <ellipse cx="60"
             cy="115"
             rx="42"
             ry="36"
             fill="url(#bodyGrad)"/>

    <!-- Head -->
    <ellipse cx="60"
             cy="90"
             rx="34"
             ry="30"
             fill="url(#bodyGrad)"/>

    <!-- Stronger head highlight -->
    <ellipse cx="52"
             cy="75"
             rx="17"
             ry="11"
             fill="url(#bodyGrad)"/>

    <!-- Face plate -->
    <ellipse cx="60"
             cy="93"
             rx="22"
             ry="20"
             fill="url(#faceWarm)"/>

    <!-- EYES -->
    <g id="eyes">

      <!-- Regular blink -->
      <animateTransform attributeName="transform"
        type="scale"
        values="1,1;1,1;1,0.12;1,1"
        keyTimes="0;0.9;0.95;1"
        dur="3.2s"
        begin="0.5s"
        repeatCount="indefinite"
        additive="sum"
        origin="60 93"/>

      <!-- LEFT eye -->
      <g id="pupilLeftWrap">

        <ellipse cx="50.5"
                 cy="92"
                 rx="7.2"
                 ry="6.8"
                 fill="url(#pupilGrad)"/>

      </g>

      <!-- RIGHT eye -->
      <g id="pupilRightWrap">

        <ellipse cx="69.2"
                 cy="92"
                 rx="7"
                 ry="6.5"
                 fill="url(#pupilGrad)"/>

      </g>

      <!-- Eye softness -->
      <ellipse cx="50.5"
               cy="92"
               rx="8"
               ry="7.5"
               fill="#000"
               opacity="0.05"
               filter="url(#softBlur)"/>

      <ellipse cx="69.2"
               cy="92"
               rx="7.8"
               ry="7.2"
               fill="#000"
               opacity="0.05"
               filter="url(#softBlur)"/>

      <!-- Highlights -->
      <circle cx="52.8"
              cy="89.2"
              r="1.7"
              fill="#FFF"
              opacity="0.95"/>

      <circle cx="71"
              cy="90"
              r="1.4"
              fill="#FFF"
              opacity="0.9"/>

    </g>

    <!-- Legs -->
    <rect x="34"
          y="143"
          width="10"
          height="18"
          rx="5"
          fill="url(#bodyGrad)"/>

    <rect x="48"
          y="145"
          width="10"
          height="16"
          rx="5"
          fill="url(#bodyGrad)"/>

    <rect x="62"
          y="145"
          width="10"
          height="16"
          rx="5"
          fill="url(#bodyGrad)"/>

    <rect x="76"
          y="143"
          width="10"
          height="18"
          rx="5"
          fill="url(#bodyGrad)"/>

  </g>

</svg>