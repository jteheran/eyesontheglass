<svg id="creature" width="120" height="200" viewBox="0 0 120 200" xmlns="http://www.w3.org/2000/svg">

  <defs>
    <!-- LIGHT FROM TOP-LEFT -->
    <radialGradient id="bodyGrad" cx="35%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="60%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#0B6E67"/>
    </radialGradient>

    <radialGradient id="faceWarm" cx="40%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFF4E6"/>
      <stop offset="100%" stop-color="#F5D0A9"/>
    </radialGradient>

    <radialGradient id="pupilGrad" cx="40%" cy="35%" r="60%">
      <stop offset="0%" stop-color="#2a2a2a"/>
      <stop offset="100%" stop-color="#000"/>
    </radialGradient>

    <!-- SOFTNESS -->
    <filter id="softBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.6"/>
    </filter>

    <filter id="shadowBlur">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
  </defs>

  <!-- Ground shadow -->
  <ellipse cx="60" cy="170" rx="34" ry="6"
           fill="#000"
           opacity="0.15"
           filter="url(#shadowBlur)"/>

  <g id="character">

    <!-- Bounce -->
    <animateTransform attributeName="transform"
      type="translate"
      values="0,0; 0,-4; 0,0"
      dur="2.8s"
      repeatCount="indefinite"/>

    <!-- Tilt -->
    <animateTransform attributeName="transform"
      type="rotate"
      values="0 60 100; 1.2 60 100; 0 60 100; -1 60 100; 0 60 100"
      dur="2.8s"
      repeatCount="indefinite"
      additive="sum"/>

    <!-- Body -->
    <ellipse cx="60" cy="115" rx="42" ry="36" fill="url(#bodyGrad)"/>
    <ellipse cx="60" cy="90" rx="34" ry="30" fill="url(#bodyGrad)"/>

    <!-- Head highlight (top-left light) -->
    <ellipse cx="52" cy="75" rx="16" ry="10"
             fill="#FFF"
             opacity="0.12"
             filter="url(#softBlur)"/>

    <!-- Face -->
    <ellipse cx="60" cy="93" rx="22" ry="20" fill="url(#faceWarm)"/>

    <!-- EYES (Tora-style) -->
    <g id="eyes">

      <!-- Blink -->
      <animateTransform attributeName="transform"
        type="scale"
        values="1,1;1,1;1,0.12;1,1"
        keyTimes="0;0.9;0.95;1"
        dur="3.3s"
        begin="0.4s"
        repeatCount="indefinite"
        additive="sum"
        origin="60 93"/>

      <!-- LEFT eye (curious, slightly more open) -->
      <g id="pupilLeftWrap">
        <ellipse cx="50.5" cy="92"
                 rx="7.2" ry="6.8"
                 fill="url(#pupilGrad)"/>
      </g>

      <!-- RIGHT eye (focused, slightly tighter) -->
      <g id="pupilRightWrap">
        <ellipse cx="69.5" cy="92"
                 rx="7.0" ry="6.4"
                 fill="url(#pupilGrad)"/>
      </g>

      <!-- Soft outer eye glow (subtle, like Om Nom softness) -->
      <ellipse cx="50.5" cy="92" rx="8" ry="7.5"
               fill="#000"
               opacity="0.05"
               filter="url(#softBlur)"/>
      <ellipse cx="69.5" cy="92" rx="7.8" ry="7.2"
               fill="#000"
               opacity="0.05"
               filter="url(#softBlur)"/>

      <!-- Highlights (directional, top-left light) -->
      <circle cx="52.8" cy="89.3" r="1.7" fill="#FFF" opacity="0.95"/>
      <circle cx="71.2" cy="90.0" r="1.4" fill="#FFF" opacity="0.9"/>

    </g>

    <!-- Antenna -->
    <path d="M60,43 Q45,25 50,13"
          stroke="#0D9488"
          stroke-width="3"
          fill="none"
          stroke-linecap="round"/>
    <circle cx="49" cy="10" r="5" fill="#0D9488"/>

    <!-- Legs -->
    <rect x="34" y="143" width="10" height="18" rx="5" fill="#0D9488"/>
    <rect x="48" y="145" width="10" height="16" rx="5" fill="#0D9488"/>
    <rect x="62" y="145" width="10" height="16" rx="5" fill="#0D9488"/>
    <rect x="76" y="143" width="10" height="18" rx="5" fill="#0D9488"/>

  </g>
</svg>